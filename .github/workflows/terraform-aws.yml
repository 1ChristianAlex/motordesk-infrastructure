
name: Terraform AWS Validation

on:
  pull_request:
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-eks.yml"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-eks.yml"
      - ".github/workflows/terraform-aws.yml"
  workflow_call:
    inputs:
      environments:
        description: Environments to validate
        required: false
        type: string
        default: '["dev", "qa", "prod"]'

      terraform_version:
        description: Terraform CLI version
        required: false
        type: string
        default: "1.10.0"

      bun_version:
        description: Bun runtime version
        required: false
        type: string
        default: "latest"

      helm_version:
        description: Helm CLI version
        required: false
        type: string
        default: "v3.16.4"

permissions:
  contents: read

jobs:
  validate-aws:
    runs-on: ubuntu-latest
    env:
      INFRASTRUCTURE_ROOT: ${{ github.repository == '1ChristianAlex/motordesk-infrastructure' && '.' || 'infrastructure' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environments || '["dev", "qa", "prod"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        if: github.repository != '1ChristianAlex/motordesk-infrastructure'
        uses: actions/checkout@v4
        with:
          repository: 1ChristianAlex/motordesk-infrastructure
          ref: main
          path: infrastructure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version || '1.10.0' }}

      - name: Terraform Format
        working-directory: ${{ env.INFRASTRUCTURE_ROOT }}/terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.INFRASTRUCTURE_ROOT }}/terraform/aws/envs/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ env.INFRASTRUCTURE_ROOT }}/terraform/aws/envs/${{ matrix.environment }}
        run: terraform validate -no-color

  validate-kubernetes-manifests:
    runs-on: ubuntu-latest
    env:
      INFRASTRUCTURE_ROOT: ${{ github.repository == '1ChristianAlex/motordesk-infrastructure' && '.' || 'infrastructure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        if: github.repository != '1ChristianAlex/motordesk-infrastructure'
        uses: actions/checkout@v4
        with:
          repository: 1ChristianAlex/motordesk-infrastructure
          ref: main
          path: infrastructure

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version || 'latest' }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm_version || 'v3.16.4' }}

      - name: Validate Kubernetes YAML and deployment scripts
        run: |
          bun "$INFRASTRUCTURE_ROOT/.github/scripts/validate-kubernetes-yaml.js"
          bash -n "$INFRASTRUCTURE_ROOT/kubernetes/deploy-workloads.sh"
          bash -n "$INFRASTRUCTURE_ROOT/kubernetes/helm/install-addons.sh"
          bash -n "$INFRASTRUCTURE_ROOT/kubernetes/helm/install-newrelic.sh"

      - name: Lint and render New Relic Helm chart
        shell: bash
        run: |
          set -euo pipefail

          source "$INFRASTRUCTURE_ROOT/kubernetes/helm/versions.env"

          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update newrelic

          helm pull newrelic/nri-bundle \
            --version "$NEW_RELIC_NRI_BUNDLE_CHART_VERSION" \
            --destination "$RUNNER_TEMP"

          bundle_chart="$RUNNER_TEMP/nri-bundle-$NEW_RELIC_NRI_BUNDLE_CHART_VERSION.tgz"

          helm lint "$bundle_chart" \
            --namespace newrelic \
            --values "$INFRASTRUCTURE_ROOT/kubernetes/newrelic/values.yaml" \
            --set-string global.cluster=validation-cluster

          helm template newrelic-kubernetes "$bundle_chart" \
            --namespace newrelic \
            --values "$INFRASTRUCTURE_ROOT/kubernetes/newrelic/values.yaml" \
            --set-string global.cluster=validation-cluster \
            > "$RUNNER_TEMP/newrelic-kubernetes.yaml"

          grep -q 'newrelic-license' "$RUNNER_TEMP/newrelic-kubernetes.yaml"
