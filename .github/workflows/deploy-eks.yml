name: Deploy EKS Runtime

on:
  workflow_call:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: string

      confirm_apply:
        description: Apply the reviewed AWS plan and deploy Kubernetes manifests
        required: false
        default: false
        type: boolean

      confirm_data_cutover:
        description: Confirm an EFS recovery point and approved maintenance window
        required: false
        default: false
        type: boolean

      aws_region:
        description: AWS region
        required: true
        type: string

      aws_tf_backend_bucket:
        description: Terraform state backend bucket
        required: true
        type: string

      api_domain_name:
        description: API domain name
        required: false
        type: string

      route53_zone_id:
        description: Route53 hosted zone ID
        required: false
        type: string

      ses_from_address:
        description: SES sender email address
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        description: AWS access key ID
        required: true

      AWS_SECRET_ACCESS_KEY:
        description: AWS secret access key
        required: true

      NEW_RELIC_LICENSE_KEY:
        description: New Relic license key
        required: true

      NEW_RELIC_EKS_LICENSE_KEY:
        description: New Relic Kubernetes license key
        required: true

permissions:
  contents: read

concurrency:
  group: eks-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_TF_BACKEND_BUCKET: ${{ inputs.aws_tf_backend_bucket }}
      API_DOMAIN_NAME: ${{ inputs.api_domain_name }}
      ROUTE53_ZONE_ID: ${{ inputs.route53_zone_id }}
      TF_VAR_ses_from_address: ${{ inputs.ses_from_address }}
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_TF_ROOT: infrastructure/terraform/aws/envs/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: 1ChristianAlex/motordesk-infrastructure
          ref: main
          path: infrastructure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Validate deployment configuration
        shell: bash
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_EKS_LICENSE_KEY: ${{ secrets.NEW_RELIC_EKS_LICENSE_KEY }}
        run: |
          set -euo pipefail

          for tool in aws docker terraform kubectl helm envsubst curl; do
            command -v "$tool" >/dev/null || {
              echo "::error::$tool is required on the GitHub-hosted runner."
              exit 1
            }
          done

          case "$ENVIRONMENT" in
            dev|qa|prod) ;;
            *)
              echo "::error::Invalid environment. Allowed values: dev, qa, prod."
              exit 1
              ;;
          esac

          test -n "$AWS_REGION" || {
            echo "::error::AWS_REGION is required."
            exit 1
          }

          test -n "$AWS_TF_BACKEND_BUCKET" || {
            echo "::error::AWS_TF_BACKEND_BUCKET is required."
            exit 1
          }

          test -n "$NEW_RELIC_LICENSE_KEY" || {
            echo "::error::NEW_RELIC_LICENSE_KEY is required."
            exit 1
          }

          test -n "$NEW_RELIC_EKS_LICENSE_KEY" || {
            echo "::error::NEW_RELIC_EKS_LICENSE_KEY is required."
            exit 1
          }

          if [[ "${{ inputs.confirm_apply }}" == "true" && "${{ inputs.confirm_data_cutover }}" != "true" ]]; then
            echo "::error::Confirm an EFS recovery point and maintenance window before deploying."
            exit 1
          fi

      - name: Configure Terraform credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan AWS infrastructure
        shell: bash
        run: |
          set -euo pipefail

          terraform -chdir="$AWS_TF_ROOT" init -input=false \
            -backend-config="bucket=$AWS_TF_BACKEND_BUCKET" \
            -backend-config="region=$AWS_REGION"

          terraform -chdir="$AWS_TF_ROOT" plan -input=false -no-color -out=infra.tfplan \
            -var="aws_region=$AWS_REGION" \
            -var="terraform_state_bucket=$AWS_TF_BACKEND_BUCKET" \
            -var="api_domain_name=$API_DOMAIN_NAME" \
            -var="route53_zone_id=$ROUTE53_ZONE_ID"

          terraform -chdir="$AWS_TF_ROOT" show -no-color infra.tfplan

      - name: Apply AWS infrastructure
        if: inputs.confirm_apply
        shell: bash
        run: terraform -chdir="$AWS_TF_ROOT" apply -input=false -auto-approve infra.tfplan

      - name: Export infrastructure outputs
        if: inputs.confirm_apply
        shell: bash
        run: |
          set -euo pipefail

          while read -r output variable; do
            value=$(terraform -chdir="$AWS_TF_ROOT" output -raw "$output")
            printf '%s=%s\n' "$variable" "$value" >> "$GITHUB_ENV"
          done <<'OUTPUTS'
          ecr_repository_url ECR_REPOSITORY_URL
          eks_cluster_name EKS_CLUSTER_NAME
          eks_cluster_version EKS_KUBERNETES_VERSION
          eks_vpc_id EKS_VPC_ID
          api_domain_name API_DOMAIN_NAME
          api_certificate_arn API_CERTIFICATE_ARN
          api_waf_web_acl_arn WAF_WEB_ACL_ARN
          efs_file_system_id EFS_FILE_SYSTEM_ID
          efs_access_point_id EFS_ACCESS_POINT_ID
          postgres_secret_arn POSTGRES_SECRET_ARN
          redis_auth_token_secret_arn REDIS_SECRET_ARN
          jwt_secret_arn JWT_SECRET_ARN
          mongo_credentials_secret_arn MONGO_SECRET_ARN
          mongo_options MONGO_OPTIONS
          parameter_store_prefix PARAMETER_STORE_PREFIX
          OUTPUTS

          printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Configure EKS deployment credentials
        if: inputs.confirm_apply
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push immutable API image
        if: inputs.confirm_apply
        shell: bash
        run: |
          set -euo pipefail

          registry="${ECR_REPOSITORY_URL%%/*}"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

          docker build --file infra/docker/Dockerfile --tag "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"

      - name: Configure EKS access from this runner
        if: inputs.confirm_apply
        shell: bash
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install cluster add-ons with Helm
        if: inputs.confirm_apply
        shell: bash
        run: bash infrastructure/kubernetes/helm/install-addons.sh

      - name: Install New Relic Kubernetes observability
        if: inputs.confirm_apply
        shell: bash
        env:
          NEW_RELIC_EKS_LICENSE_KEY: ${{ secrets.NEW_RELIC_EKS_LICENSE_KEY }}
        run: bash infrastructure/kubernetes/helm/install-newrelic.sh

      - name: Apply Kubernetes YAML workloads
        if: inputs.confirm_apply
        shell: bash
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: bash infrastructure/kubernetes/deploy-workloads.sh
